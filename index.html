<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tagihan Sampah</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
            --danger: #d32f2f;
            --success: #388e3c;
            --share-color: #007bff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; background: var(--primary); color: white; padding: 20px; border-radius: 8px; }
        header input { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.5); color: white; text-align: center; padding: 5px; border-radius: 4px; width: 80%; max-width: 400px; }
        header input::placeholder { color: rgba(255, 255, 255, 0.8); }
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        .form-group input { padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        .btn:hover { background-color: var(--primary-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background-color: #f8f9fa; color: #555; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background-color: #ffebee; color: var(--danger); }
        .badge-paid { background-color: #e8f5e9; color: var(--success); }
        .btn-action { border: none; cursor: pointer; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; margin: 2px; }
        .btn-pay { background-color: #e3f2fd; color: #1976d2; }
        .btn-share { background-color: var(--share-color); color: white; }
        .btn-delete { background-color: #ffebee; color: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Tagihan Sampah</h1>
            <input type="text" id="namaPerumahan" placeholder="Nama Perumahan" oninput="savePerumahanName()">
        </header>

        <div class="card">
            <h3>Tambah Data Warga</h3>
            <form id="billForm" style="margin-top: 15px;">
                <div class="form-grid">
                    <div class="form-group"><label>Nama Pemilik</label><input type="text" id="namaPemilik" required placeholder="Contoh: Budi Santoso"></div>
                    <div class="form-group"><label>No. Rumah</label><input type="text" id="noRumah" required placeholder="Contoh: A-12"></div>
                    <div class="form-group"><label>No. WhatsApp</label><input type="tel" id="noWhatsapp" required placeholder="Contoh: 081234567890"></div>
                    <div class="form-group"><label>Jumlah Iuran (Rp)</label><input type="number" id="jumlahIuran" required placeholder="Contoh: 50000"></div>
                    <div class="form-group"><label>Tanggal Jatuh Tempo</label><input type="date" id="jatuhTempo" required></div>
                </div>
                <button type="submit" class="btn">Simpan Data Tagihan</button>
            </form>
        </div>

        <div class="card">
            <h3>Daftar Riwayat & Tagihan Iuran</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Perumahan</th>
                            <th>Nomor Rumah</th>
                            <th>Nomor WA</th>
                            <th>Iuran</th>
                            <th>Jatuh Tempo</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="billTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let bills = JSON.parse(localStorage.getItem('perumahan_bills')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('namaPerumahan').value = localStorage.getItem('perumahan_nama') || '';
            renderTable();
        });

        function savePerumahanName() { 
            localStorage.setItem('perumahan_nama', document.getElementById('namaPerumahan').value); 
            renderTable();
        }

        document.getElementById('billForm').addEventListener('submit', function(e) {
            e.preventDefault();
            bills.push({
                id: Date.now(),
                namaPemilik: document.getElementById('namaPemilik').value,
                noRumah: document.getElementById('noRumah').value,
                noWhatsapp: document.getElementById('noWhatsapp').value,
                jumlahIuran: parseInt(document.getElementById('jumlahIuran').value),
                jatuhTempo: document.getElementById('jatuhTempo').value,
                status: 'Belum Bayar'
            });
            saveData();
            renderTable();
            this.reset();
        });

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateString + 'T00:00:00').toLocaleDateString('id-ID', options);
        }

        function getNextMonthDate(dateString) {
            const date = new Date(dateString + 'T00:00:00');
            const currentDay = date.getDate();
            
            date.setMonth(date.getMonth() + 1);

            if (date.getDate() !== currentDay) {
                date.setDate(0); 
            }

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }

        function markAsPaid(id) {
            const bill = bills.find(b => b.id === id);
            const nextDate = getNextMonthDate(bill.jatuhTempo);

            if (confirm(`Konfirmasi Pembayaran:\nAtas Nama: ${bill.namaPemilik} (${bill.noRumah})\n\nTagihan ini akan diubah menjadi LUNAS sebagai riwayat, dan tagihan baru untuk bulan berikutnya (${formatDate(nextDate)}) akan otomatis dibuat.`)) {
                
                // 1. Ubah status bulan ini menjadi Lunas (menjadi riwayat)
                bills = bills.map(b => b.id === id ? {...b, status: 'Lunas'} : b);

                // 2. Buat baris tagihan baru untuk bulan depan
                const newBill = {
                    id: Date.now(),
                    namaPemilik: bill.namaPemilik,
                    noRumah: bill.noRumah,
                    noWhatsapp: bill.noWhatsapp,
                    jumlahIuran: bill.jumlahIuran,
                    jatuhTempo: nextDate,
                    status: 'Belum Bayar'
                };

                bills.push(newBill);

                saveData();
                renderTable();
            }
        }

        function deleteBill(id) {
            if (confirm('Yakin ingin menghapus data riwayat/tagihan ini?')) {
                bills = bills.filter(b => b.id !== id);
                saveData();
                renderTable();
            }
        }

        async function shareReminder(id) {
            const bill = bills.find(b => b.id === id);
            const namaPerumahan = localStorage.getItem('perumahan_nama') || 'Perumahan';
            const msg = `Halo Bapak/Ibu *${bill.namaPemilik}* (${bill.noRumah}),\n\n` +
                        `Mengingatkan untuk pembayaran *Iuran Sampah ${namaPerumahan}* sebesar *${formatRupiah(bill.jumlahIuran)}*.\n` +
                        `Tanggal Jatuh Tempo: *${formatDate(bill.jatuhTempo)}*.\n\n` +
                        `Mohon segera melakukan pembayaran. Terima kasih!`;

            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Tagihan Iuran Sampah', text: msg });
                } catch (err) { console.log('Share dibatalkan'); }
            } else {
                navigator.clipboard.writeText(msg);
                alert("Pesan pengingat telah disalin ke clipboard!");
            }
        }

        function saveData() { localStorage.setItem('perumahan_bills', JSON.stringify(bills)); }

        function renderTable() {
            const tbody = document.getElementById('billTableBody');
            const namaPerumahan = localStorage.getItem('perumahan_nama') || '-';
            tbody.innerHTML = bills.length === 0 ? `<tr><td colspan="8" style="text-align:center; color:#888;">Belum ada data tagihan.</td></tr>` : '';

            // Urutkan dari yang terbaru di atas
            const sortedBills = [...bills].reverse();

            sortedBills.forEach(bill => {
                const isPaid = bill.status === 'Lunas';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${bill.namaPemilik}</strong></td>
                    <td>${namaPerumahan}</td>
                    <td>${bill.noRumah}</td>
                    <td>${bill.noWhatsapp}</td>
                    <td>${formatRupiah(bill.jumlahIuran)}</td>
                    <td>${formatDate(bill.jatuhTempo)}</td>
                    <td><span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${bill.status}</span></td>
                    <td>
                        ${!isPaid ? `<button class="btn-action btn-pay" onclick="markAsPaid(${bill.id})">Bayar</button>` : ''}
                        ${!isPaid ? `<button class="btn-action btn-share" onclick="shareReminder(${bill.id})">Share</button>` : ''}
                        <button class="btn-action btn-delete" onclick="deleteBill(${bill.id})">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
