<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Tagihan Sampah Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { background: #2e7d32; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #e0e0e0; color: #333; }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    
    .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2e7d32; font-size: 16px; border-bottom: 2px solid #e8f5e9; padding-bottom: 8px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
    input, select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    
    .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-green { background: #28a745; }
    .btn-green:hover { background: #218838; }
    .btn-blue { background: #007bff; }
    .btn-orange { background: #fd7e14; }
    .btn-red { background: #dc3545; }
    .btn-gray { background: #6c757d; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; }
    th { background: #f8f9fa; color: #333; }
    .badge-bayar { padding: 3px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; }
    .badge-lunas { background: #d4edda; color: #155724; }
    .badge-pending { background: #fff3cd; color: #856404; }

    /* Modal Struk Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 320px; text-align: center; }

    /* Layout Struk 58mm Thermal */
    #receipt-area {
      width: 58mm;
      padding: 4mm;
      background: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      line-height: 1.2;
      border: 1px dashed #ccc;
      margin: 0 auto 15px auto;
      text-align: left;
      color: #000;
    }
    #receipt-area h4 { text-align: center; margin: 0 0 5px 0; font-size: 12px; text-transform: uppercase; }
    #receipt-area p { margin: 2px 0; }
    .dashed-line { border-bottom: 1px dashed #000; margin: 6px 0; }

    /* CSS Khusus Print Thermal */
    @media print {
      body * { visibility: hidden; }
      #modalStruk, #modalStruk * { visibility: visible; }
      #receipt-area, #receipt-area * { visibility: visible; }
      #receipt-area { position: absolute; left: 0; top: 0; width: 58mm; border: none; padding: 0; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2 style="margin: 0 0 5px 0;">Sistem Tagihan Sampah Online</h2>
      <div id="status_server" class="status-badge status-offline">Memeriksa Koneksi...</div>
    </div>

    <!-- 1. Form Master Perumahan -->
    <div class="card">
      <h3>Tambah Master Perumahan</h3>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="new_perumahan" placeholder="Contoh: Paradise Residence 4" style="flex: 1;">
        <button class="btn btn-blue" onclick="addPerumahan()">+ Tambah Perumahan</button>
      </div>
    </div>

    <!-- 2. Form Input Tagihan Warga -->
    <div class="card">
      <h3>Tambah Tagihan Warga Baru</h3>
      <input type="hidden" id="edit_id">
      <div class="form-grid">
        <div class="form-group">
          <label>Nama Perumahan / Perum:</label>
          <select id="select_perumahan"><option value="">Loading...</option></select>
        </div>
        <div class="form-group">
          <label>Nama Warga / Pemilik:</label>
          <input type="text" id="nama_warga" placeholder="Contoh: Budi Santoso">
        </div>
        <div class="form-group">
          <label>No. Rumah / Blok:</label>
          <input type="text" id="no_rumah" placeholder="Contoh: A-12">
        </div>
        <div class="form-group">
          <label>Jumlah Iuran (Rp):</label>
          <input type="number" id="jumlah_iuran" placeholder="Contoh: 35000">
        </div>
      </div>
      <button class="btn btn-green" id="btn_simpan" onclick="simpanTagihan()">💾 Simpan ke Database</button>
      <button class="btn btn-gray" id="btn_batal" onclick="resetForm()" style="display: none;">Batal</button>
    </div>

    <!-- 3. Tabel Data Tagihan -->
    <div class="card">
      <h3>Daftar Tagihan Sampah Warga</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Warga</th>
              <th>Perumahan</th>
              <th>No. Rumah</th>
              <th>Iuran</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="table_data">
            <tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Struk Thermal 58mm -->
  <div id="modalStruk" class="modal">
    <div class="modal-content">
      <div id="receipt-area">
        <h4>E-RETRIBUSI SAMPAH</h4>
        <p style="text-align: center;" id="r_perumahan_head"></p>
        <div class="dashed-line"></div>
        <p id="r_tanggal"></p>
        <p id="r_warga"></p>
        <p id="r_norumah"></p>
        <p id="r_perumahan"></p>
        <div class="dashed-line"></div>
        <p id="r_iuran"></p>
        <p id="r_status"></p>
        <div class="dashed-line"></div>
        <p style="text-align: center; margin-top: 8px;">Terima Kasih Atas<br>Pembayaran Anda!</p>
      </div>
      <div class="no-print" style="display: flex; gap: 8px; justify-content: center;">
        <button class="btn btn-green" onclick="window.print()">🖨️ Print Thermal</button>
        <button class="btn btn-red" onclick="closeStruk()">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://perrqmlciaemfushewmh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcnJxbWxjaWFlbWZ1c2hld21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxOTA4MTksImV4cCI6MjEwMjc2NjgxOX0.VNgPSSbJVX1ib95NJC7ufZxSkBi2ocB17syX4A0BD5A";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inisialisasi
    window.onload = async () => {
      await checkConnection();
      await loadPerumahan();
      await loadTagihan();
    };

    // 1. Cek Koneksi Supabase
    async function checkConnection() {
      const statusEl = document.getElementById('status_server');
      try {
        const { error } = await _supabase.from('master_perumahan').select('id').limit(1);
        if (error && error.code !== 'PGRST116') throw error;
        statusEl.className = "status-badge status-online";
        statusEl.innerText = "Terhubung (Online)";
      } catch (err) {
        statusEl.className = "status-badge status-offline";
        statusEl.innerText = "Gagal Terhubung: " + err.message;
      }
    }

    // 2. Kelola Master Perumahan
    async function addPerumahan() {
      const nama = document.getElementById('new_perumahan').value.trim();
      if (!nama) return alert('Isi nama perumahan terlebih dahulu!');

      const { error } = await _supabase.from('master_perumahan').insert([{ nama_perumahan: nama }]);

      if (error) {
        alert('Gagal menambah perumahan: ' + error.message);
      } else {
        alert('Berhasil menambah perumahan!');
        document.getElementById('new_perumahan').value = '';
        loadPerumahan();
      }
    }

    async function loadPerumahan() {
      const select = document.getElementById('select_perumahan');
      const { data, error } = await _supabase.from('master_perumahan').select('*');
      if (error) return;
      
      select.innerHTML = '<option value="">-- Pilih Perumahan --</option>';
      data?.forEach(p => {
        select.innerHTML += `<option value="${p.nama_perumahan}">${p.nama_perumahan}</option>`;
      });
    }

    // 3. Simpan & Edit Tagihan
    async function simpanTagihan() {
      const editId = document.getElementById('edit_id').value;
      const perumahan = document.getElementById('select_perumahan').value;
      const warga = document.getElementById('nama_warga').value.trim();
      const rumah = document.getElementById('no_rumah').value.trim();
      const iuran = document.getElementById('jumlah_iuran').value;

      if (!perumahan || !warga || !rumah || !iuran) return alert('Lengkapi semua data!');

      const payload = {
        nama_perumahan: perumahan,
        nama_warga: warga,
        no_rumah: rumah,
        iuran: Number(iuran)
      };

      let error;
      if (editId) {
        ({ error } = await _supabase.from('tagihan').update(payload).eq('id', editId));
      } else {
        payload.status_bayar = false;
        ({ error } = await _supabase.from('tagihan').insert([payload]));
      }

      if (error) {
        alert('Gagal menyimpan data: ' + error.message);
      } else {
        resetForm();
        loadTagihan();
      }
    }

    // 4. Render Tabel Data
    async function loadTagihan() {
      const tbody = document.getElementById('table_data');
      const { data, error } = await _supabase.from('tagihan').select('*').order('id', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">Error: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada data tagihan.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      data.forEach(row => {
        const isLunas = row.status_bayar === true || row.status_bayar === 'true';
        tbody.innerHTML += `
          <tr>
            <td><b>${row.nama_warga}</b></td>
            <td>${row.nama_perumahan}</td>
            <td>${row.no_rumah}</td>
            <td>Rp ${Number(row.iuran).toLocaleString('id-ID')}</td>
            <td>
              <span class="badge-bayar ${isLunas ? 'badge-lunas' : 'badge-pending'}">
                ${isLunas ? 'LUNAS' : 'BELUM BAYAR'}
              </span>
            </td>
            <td>
              <button class="btn btn-blue" onclick="cetakStruk('${row.nama_warga}', '${row.nama_perumahan}', '${row.no_rumah}', ${row.iuran}, ${isLunas})">🧾 Struk</button>
              <button class="btn btn-orange" onclick="editData('${row.id}', '${row.nama_perumahan}', '${row.nama_warga}', '${row.no_rumah}', ${row.iuran})">✏️ Edit</button>
              <button class="btn btn-green" onclick="bayarData('${row.id}', ${isLunas})">💳 ${isLunas ? 'Batal Bayar' : 'Bayar'}</button>
            </td>
          </tr>`;
      });
    }

    // 5. Fungsi Aksi dengan Proteksi Password untuk Batal Bayar
    async function bayarData(id, statusSekarang) {
      if (statusSekarang) {
        const pass = prompt("Masukkan Password untuk Batal Bayar:");
        if (pass === null) return; // Pengguna menekan tombol Batal
        if (pass !== "12345") {
          alert("Password salah! Aksi Batal Bayar dibatalkan.");
          return;
        }
      }

      const { error } = await _supabase.from('tagihan').update({ status_bayar: !statusSekarang }).eq('id', id);
      if (error) alert('Gagal memperbarui status: ' + error.message);
      else loadTagihan();
    }

    function editData(id, perum, warga, rumah, iuran) {
      document.getElementById('edit_id').value = id;
      document.getElementById('select_perumahan').value = perum;
      document.getElementById('nama_warga').value = warga;
      document.getElementById('no_rumah').value = rumah;
      document.getElementById('jumlah_iuran').value = iuran;

      document.getElementById('btn_simpan').innerText = '💾 Update Data';
      document.getElementById('btn_batal').style.display = 'inline-block';
    }

    function resetForm() {
      document.getElementById('edit_id').value = '';
      document.getElementById('nama_warga').value = '';
      document.getElementById('no_rumah').value = '';
      document.getElementById('jumlah_iuran').value = '';
      document.getElementById('btn_simpan').innerText = '💾 Simpan ke Database';
      document.getElementById('btn_batal').style.display = 'none';
    }

    function cetakStruk(warga, perum, rumah, iuran, isLunas) {
      document.getElementById('r_perumahan_head').innerText = perum;
      document.getElementById('r_tanggal').innerText = "Tgl   : " + new Date().toLocaleDateString('id-ID');
      document.getElementById('r_warga').innerText = "Warga : " + warga;
      document.getElementById('r_norumah').innerText = "No.   : " + rumah;
      document.getElementById('r_perumahan').innerText = "Perum : " + perum;
      document.getElementById('r_iuran').innerText = "Total : Rp " + Number(iuran).toLocaleString('id-ID');
      document.getElementById('r_status').innerText = "Status: " + (isLunas ? 'LUNAS' : 'BELUM BAYAR');
      
      document.getElementById('modalStruk').style.display = 'flex';
    }

    function closeStruk() {
      document.getElementById('modalStruk').style.display = 'none';
    }
  </script>
</body>
</html>
