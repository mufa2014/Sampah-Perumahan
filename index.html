<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Tagihan Sampah Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; margin: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-weight: bold; }
    .btn-green { background: #28a745; }
    .btn-blue { background: #007bff; }
    .btn-orange { background: #fd7e14; }
    .btn-red { background: #dc3545; }
    .btn-gray { background: #6c757d; }
    .form-group { margin-bottom: 15px; display: inline-block; vertical-align: top; margin-right: 10px; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f8f9fa; }

    /* Modal Struk Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; text-align: center; }

    /* Layout Struk 58mm Thermal */
    #receipt-area {
      width: 58mm;
      padding: 5mm;
      background: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 1.2;
      border: 1px dashed #ccc;
      margin: 0 auto 15px auto;
      text-align: left;
    }
    #receipt-area h4 { text-align: center; margin: 0 0 5px 0; }
    .dashed-line { border-bottom: 1px dashed #000; margin: 5px 0; }

    /* CSS Khusus Print Thermal */
    @media print {
      body * { visibility: hidden; }
      #receipt-area, #receipt-area * { visibility: visible; }
      #receipt-area { position: absolute; left: 0; top: 0; width: 58mm; border: none; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Tambah / Kelola Master Perumahan</h3>
    <div class="form-group">
      <input type="text" id="new_perumahan" placeholder="Nama Perumahan Baru">
      <button class="btn btn-blue" onclick="addPerumahan()">+ Tambah Perumahan</button>
    </div>
  </div>

  <div class="card">
    <h3>Tambah Tagihan Warga Baru</h3>
    <div class="form-group">
      <label>Perumahan:</label><br>
      <select id="select_perumahan"></select>
    </div>
    <div class="form-group">
      <label>Nama Warga:</label><br>
      <input type="text" id="nama_warga">
    </div>
    <div class="form-group">
      <label>No. Rumah:</label><br>
      <input type="text" id="no_rumah">
    </div>
    <div class="form-group">
      <label>Jumlah Iuran (Rp):</label><br>
      <input type="number" id="jumlah_iuran" value="35000">
    </div>
    <button class="btn btn-green" onclick="simpanTagihan()">💾 Simpan Tagihan</button>
  </div>

  <div class="card">
    <h3>Daftar Tagihan Sampah Warga</h3>
    <table>
      <thead>
        <tr>
          <th>Warga</th>
          <th>Perumahan</th>
          <th>No. Rumah</th>
          <th>Iuran</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="table_data">
        <!-- Data Rendered Here -->
      </tbody>
    </table>
  </div>

  <!-- Modal Display Struk -->
  <div id="modalStruk" class="modal">
    <div class="modal-content">
      <div id="receipt-area">
        <h4>E-RETRIBUSI SAMPAH</h4>
        <div class="dashed-line"></div>
        <p id="r_tanggal"></p>
        <p id="r_perumahan"></p>
        <p id="r_warga"></p>
        <p id="r_norumah"></p>
        <div class="dashed-line"></div>
        <p id="r_iuran"></p>
        <p id="r_status"></p>
        <div class="dashed-line"></div>
        <p style="text-align: center;">Terima Kasih Atas Pembayaran Anda!</p>
      </div>
      <button class="btn btn-green" onclick="window.print()">🖨️ Print Thermal</button>
      <button class="btn btn-red" onclick="closeStruk()">Tutup</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "URL_SUPABASE_ANDA";
    const SUPABASE_KEY = "KEY_ANON_SUPABASE_ANDA";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Tambah Master Perumahan
    async function addPerumahan() {
      const nama = document.getElementById('new_perumahan').value;
      if(!nama) return alert('Isi nama perumahan');
      await _supabase.from('master_perumahan').insert([{ nama_perumahan: nama }]);
      document.getElementById('new_perumahan').value = '';
      loadPerumahan();
    }

    async function loadPerumahan() {
      const { data } = await _supabase.from('master_perumahan').select('*');
      const select = document.getElementById('select_perumahan');
      select.innerHTML = '';
      data?.forEach(p => {
        select.innerHTML += `<option value="${p.nama_perumahan}">${p.nama_perumahan}</option>`;
      });
    }

    // 2. Tampilkan Tagihan & Tombol Aksi
    async function loadTagihan() {
      const { data } = await _supabase.from('tagihan').select('*');
      const tbody = document.getElementById('table_data');
      tbody.innerHTML = '';
      
      data?.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td>${row.nama_warga}</td>
            <td>${row.nama_perumahan}</td>
            <td>${row.no_rumah}</td>
            <td>Rp ${Number(row.iuran).toLocaleString('id-ID')}</td>
            <td>${row.status_bayar ? 'Lunas' : 'Belum Bayar'}</td>
            <td>
              <button class="btn btn-blue" onclick="cetakStruk('${row.nama_warga}', '${row.nama_perumahan}', '${row.no_rumah}', ${row.iuran}, '${row.status_bayar}')">🧾 Struk</button>
              <button class="btn btn-orange" onclick="editData('${row.id}')">✏️ Edit</button>
              <button class="btn btn-green" onclick="bayarData('${row.id}')">💳 Bayar</button>
            </td>
          </tr>`;
      });
    }

    // 3. Logika Cetak Struk
    function cetakStruk(warga, perum, rumah, iuran, status) {
      document.getElementById('r_tanggal').innerText = "Tgl: " + new Date().toLocaleDateString('id-ID');
      document.getElementById('r_perumahan').innerText = "Perum : " + perum;
      document.getElementById('r_warga').innerText = "Warga : " + warga;
      document.getElementById('r_norumah').innerText = "No.   : " + rumah;
      document.getElementById('r_iuran').innerText = "Iuran : Rp " + Number(iuran).toLocaleString('id-ID');
      document.getElementById('r_status').innerText = "Status: " + (status === 'true' || status === true ? 'LUNAS' : 'PENDING');
      
      document.getElementById('modalStruk').style.display = 'flex';
    }

    function closeStruk() {
      document.getElementById('modalStruk').style.display = 'none';
    }

    // Inisialisasi awal
    loadPerumahan();
    loadTagihan();
  </script>
</body>
</html>
