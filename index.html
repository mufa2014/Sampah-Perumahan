<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tagihan Sampah Multi-Perumahan</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
            --danger: #d32f2f;
            --success: #388e3c;
            --share-color: #007bff;
            --warning: #f57c00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; background: var(--primary); color: white; padding: 20px; border-radius: 8px; }
        
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        .btn:hover { background-color: var(--primary-hover); }
        
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .filters-group { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
        .filter-item { display: flex; align-items: center; gap: 8px; }
        .filter-item label { font-size: 0.85rem; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background-color: #f8f9fa; color: #555; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background-color: #ffebee; color: var(--danger); }
        .badge-paid { background-color: #e8f5e9; color: var(--success); }
        .btn-action { border: none; cursor: pointer; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; margin: 2px; }
        .btn-pay { background-color: #e3f2fd; color: #1976d2; }
        .btn-share { background-color: var(--share-color); color: white; }
        .btn-edit { background-color: #fff3e0; color: var(--warning); }
        .btn-delete { background-color: #ffebee; color: var(--danger); }
        .btn-secondary { background-color: #f5f5f5; border: 1px solid var(--border); color: #333; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Tagihan Sampah</h1>
            <p style="font-size: 0.9rem; margin-top: 5px; opacity: 0.9;">Kelola Iuran Berbagai Perumahan</p>
        </header>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="formTitle">Tambah Data Warga</h3>
                <button type="button" class="btn-secondary" onclick="tambahNamaPerumahan()">+ Kelola Master Perumahan</button>
            </div>
            
            <form id="billForm">
                <input type="hidden" id="editId" value="">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Perumahan</label>
                        <select id="namaPerumahan" required>
                            <option value="">-- Pilih Perumahan --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nama Pemilik</label>
                        <input type="text" id="namaPemilik" required placeholder="Contoh: Budi Santoso">
                    </div>
                    <div class="form-group">
                        <label>No. Rumah</label>
                        <input type="text" id="noRumah" required placeholder="Contoh: A-12">
                    </div>
                    <div class="form-group">
                        <label>No. WhatsApp</label>
                        <input type="tel" id="noWhatsapp" required placeholder="Contoh: 081234567890">
                    </div>
                    <div class="form-group">
                        <label>Jumlah Iuran (Rp)</label>
                        <input type="number" id="jumlahIuran" required placeholder="Contoh: 50000">
                    </div>
                    <div class="form-group">
                        <label>Tanggal Jatuh Tempo</label>
                        <input type="date" id="jatuhTempo" required>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn" id="btnSubmit">Simpan Data Tagihan</button>
                    <button type="button" class="btn" id="btnCancelEdit" style="background-color: #757575; display: none;" onclick="resetForm()">Batal Edit</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header-flex">
                <h3>Daftar Tagihan Iuran</h3>
                <div class="filters-group">
                    <div class="filter-item">
                        <label for="filterPerumahan">Perumahan:</label>
                        <select id="filterPerumahan" onchange="renderTable()" style="padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;">
                            <option value="Semua">Semua Perumahan</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label for="filterBulan">Periode:</label>
                        <input type="month" id="filterBulan" onchange="renderTable()" style="padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;">
                    </div>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Perumahan</th>
                            <th>Nomor Rumah</th>
                            <th>Nomor WA</th>
                            <th>Iuran</th>
                            <th>Jatuh Tempo</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="billTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let bills = JSON.parse(localStorage.getItem('perumahan_bills')) || [];
        let masterPerumahan = JSON.parse(localStorage.getItem('master_perumahan')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('filterBulan').value = `${year}-${month}`;

            // Sync master perumahan dari data awal jika kosong
            if (masterPerumahan.length === 0 && bills.length > 0) {
                masterPerumahan = [...new Set(bills.map(b => b.namaPerumahan))];
                saveMasterPerumahan();
            }

            renderPerumahanDropdowns();
            renderTable();
        });

        function tambahNamaPerumahan() {
            const input = prompt("Masukkan Nama Perumahan Baru:");
            if (input && input.trim() !== "") {
                const nama = input.trim();
                if (!masterPerumahan.includes(nama)) {
                    masterPerumahan.push(nama);
                    saveMasterPerumahan();
                    renderPerumahanDropdowns();
                    document.getElementById('namaPerumahan').value = nama;
                } else {
                    alert("Nama perumahan tersebut sudah ada!");
                }
            }
        }

        function renderPerumahanDropdowns() {
            const selectForm = document.getElementById('namaPerumahan');
            const selectFilter = document.getElementById('filterPerumahan');
            
            const currentFilterVal = selectFilter.value;
            const currentFormVal = selectForm.value;

            // Urutkan nama perumahan sesuai abjad dan nomor secara alami (Natural Sort)
            masterPerumahan.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

            selectForm.innerHTML = '<option value="">-- Pilih Perumahan --</option>';
            selectFilter.innerHTML = '<option value="Semua">Semua Perumahan</option>';

            masterPerumahan.forEach(p => {
                if (!p) return;
                const opt1 = document.createElement('option');
                opt1.value = p;
                opt1.textContent = p;
                selectForm.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = p;
                opt2.textContent = p;
                selectFilter.appendChild(opt2);
            });

            if (masterPerumahan.includes(currentFormVal)) selectForm.value = currentFormVal;
            if (masterPerumahan.includes(currentFilterVal)) selectFilter.value = currentFilterVal;
        }

        document.getElementById('billForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const inputTempo = document.getElementById('jatuhTempo').value;
            const inputPerumahan = document.getElementById('namaPerumahan').value;

            if (editId) {
                bills = bills.map(b => {
                    if (b.id == editId) {
                        return {
                            ...b,
                            namaPerumahan: inputPerumahan,
                            namaPemilik: document.getElementById('namaPemilik').value,
                            noRumah: document.getElementById('noRumah').value,
                            noWhatsapp: document.getElementById('noWhatsapp').value,
                            jumlahIuran: parseInt(document.getElementById('jumlahIuran').value),
                            jatuhTempo: inputTempo
                        };
                    }
                    return b;
                });
            } else {
                bills.push({
                    id: Date.now(),
                    namaPerumahan: inputPerumahan,
                    namaPemilik: document.getElementById('namaPemilik').value,
                    noRumah: document.getElementById('noRumah').value,
                    noWhatsapp: document.getElementById('noWhatsapp').value,
                    jumlahIuran: parseInt(document.getElementById('jumlahIuran').value),
                    jatuhTempo: inputTempo,
                    status: 'Belum Bayar'
                });
            }

            document.getElementById('filterBulan').value = inputTempo.slice(0, 7);
            document.getElementById('filterPerumahan').value = inputPerumahan;

            saveData();
            renderTable();
            resetForm();
        });

        function editBill(id) {
            const bill = bills.find(b => b.id === id);
            if (!bill) return;

            document.getElementById('editId').value = bill.id;
            document.getElementById('namaPerumahan').value = bill.namaPerumahan;
            document.getElementById('namaPemilik').value = bill.namaPemilik;
            document.getElementById('noRumah').value = bill.noRumah;
            document.getElementById('noWhatsapp').value = bill.noWhatsapp;
            document.getElementById('jumlahIuran').value = bill.jumlahIuran;
            document.getElementById('jatuhTempo').value = bill.jatuhTempo;

            document.getElementById('formTitle').textContent = "Edit Data Warga";
            document.getElementById('btnSubmit').textContent = "Update Data";
            document.getElementById('btnCancelEdit').style.display = "block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('billForm').reset();
            document.getElementById('editId').value = "";
            document.getElementById('formTitle').textContent = "Tambah Data Warga";
            document.getElementById('btnSubmit').textContent = "Simpan Data Tagihan";
            document.getElementById('btnCancelEdit').style.display = "none";
        }

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateString + 'T00:00:00').toLocaleDateString('id-ID', options);
        }

        function getNextMonthDate(dateString) {
            const date = new Date(dateString + 'T00:00:00');
            const currentDay = date.getDate();
            
            date.setMonth(date.getMonth() + 1);

            if (date.getDate() !== currentDay) {
                date.setDate(0); 
            }

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }

        function markAsPaid(id) {
            const bill = bills.find(b => b.id === id);
            const nextDate = getNextMonthDate(bill.jatuhTempo);

            if (confirm(`Konfirmasi Pembayaran:\nAtas Nama: ${bill.namaPemilik} (${bill.namaPerumahan} - ${bill.noRumah})\n\nTagihan bulan ini akan disimpan sebagai LUNAS, dan tagihan baru periode (${formatDate(nextDate)}) otomatis dibuat.`)) {
                
                bills = bills.map(b => b.id === id ? {...b, status: 'Lunas'} : b);

                const newBill = {
                    id: Date.now(),
                    namaPerumahan: bill.namaPerumahan,
                    namaPemilik: bill.namaPemilik,
                    noRumah: bill.noRumah,
                    noWhatsapp: bill.noWhatsapp,
                    jumlahIuran: bill.jumlahIuran,
                    jatuhTempo: nextDate,
                    status: 'Belum Bayar'
                };

                bills.push(newBill);

                saveData();
                renderTable();
            }
        }

        function deleteBill(id) {
            if (confirm('Yakin ingin menghapus data ini?')) {
                bills = bills.filter(b => b.id !== id);
                saveData();
                renderTable();
            }
        }

        async function shareReminder(id) {
            const bill = bills.find(b => b.id === id);
            const msg = `Halo Bapak/Ibu *${bill.namaPemilik}* (${bill.noRumah}),\n\n` +
                        `Mengingatkan untuk pembayaran *Iuran Sampah ${bill.namaPerumahan}* sebesar *${formatRupiah(bill.jumlahIuran)}*.\n` +
                        `Tanggal Jatuh Tempo: *${formatDate(bill.jatuhTempo)}*.\n\n` +
                        `Mohon segera melakukan pembayaran. Terima kasih!`;

            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Tagihan Iuran Sampah', text: msg });
                } catch (err) { console.log('Pengingat dibatalkan'); }
            } else {
                navigator.clipboard.writeText(msg);
                alert("Pesan pengingat telah disalin ke clipboard!");
            }
        }

        function saveData() { localStorage.setItem('perumahan_bills', JSON.stringify(bills)); }
        function saveMasterPerumahan() { localStorage.setItem('master_perumahan', JSON.stringify(masterPerumahan)); }

        function renderTable() {
            const tbody = document.getElementById('billTableBody');
            const selectedMonth = document.getElementById('filterBulan').value; 
            const selectedPerumahan = document.getElementById('filterPerumahan').value;

            tbody.innerHTML = '';

            const filteredBills = bills.filter(bill => {
                const matchMonth = bill.jatuhTempo.startsWith(selectedMonth);
                const matchPerumahan = selectedPerumahan === 'Semua' || bill.namaPerumahan === selectedPerumahan;
                return matchMonth && matchPerumahan;
            });

            if (filteredBills.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#888;">Tidak ada data tagihan untuk kriteria ini.</td></tr>`;
                return;
            }

            const sortedBills = [...filteredBills].reverse();

            sortedBills.forEach(bill => {
                const isPaid = bill.status === 'Lunas';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${bill.namaPemilik}</strong></td>
                    <td>${bill.namaPerumahan}</td>
                    <td>${bill.noRumah}</td>
                    <td>${bill.noWhatsapp}</td>
                    <td>${formatRupiah(bill.jumlahIuran)}</td>
                    <td>${formatDate(bill.jatuhTempo)}</td>
                    <td><span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${bill.status}</span></td>
                    <td>
                        ${!isPaid ? `<button class="btn-action btn-pay" onclick="markAsPaid(${bill.id})">Bayar</button>` : ''}
                        ${!isPaid ? `<button class="btn-action btn-share" onclick="shareReminder(${bill.id})">Ingatkan</button>` : ''}
                        <button class="btn-action btn-delete" onclick="deleteBill(${bill.id})">Hapus</button>
                        <button class="btn-action btn-edit" onclick="editBill(${bill.id})">Edit</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
